    <rect x="6.55" y="4.6" width="2.2" height="9" rx="1.1"/>
    <rect x="9.55" y="2.9" width="2.2" height="10.7" rx="1.1"/>
    <rect x="12.55" y="3.5" width="2.2" height="10.1" rx="1.1"/>
    <rect x="15.5" y="5.4" width="2.15" height="8.2" rx="1.07"/>
    <rect x="2.5" y="8.5" width="2.1" height="6.6" rx="1.05" transform="rotate(-24 3.55 11.8)"/>
    <path d="M5.1 11.6h13.8a.9.9 0 0 1 .9.9v3.6a4.2 4.2 0 0 1-4.2 4.2H8.4a4.2 4.2 0 0 1-4.2-4.2v-3.6a.9.9 0 0 1 .9-.9z"/>
    <rect x="6.9" y="21.1" width="10.2" height="2.4" rx="1.2"/>
  </g>
</svg>
