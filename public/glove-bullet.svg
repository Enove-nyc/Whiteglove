<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-hidden="true">
  <!-- The White Glove mark reduced to a bullet: a cuffed, gloved hand. Drawn as
       a silhouette rather than the logo's line art, because line art of this
       size fills in and turns to mush at 14px. The gap under the palm keeps the
       cuff readable when it is only a few pixels tall. -->
