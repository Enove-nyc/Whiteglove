name: Finalize reviewed place photos and basic map
on:
  push:
    branches: [codex/destination-photo-research]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize assets]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install Pillow
      - run: python scripts/finalize-discovery-photo-assets.py
      - run: npm install --prefix /tmp/map-capture --ignore-scripts --no-audit --no-fund playwright@1.62.0 leaflet@1.9.4
      - run: node /tmp/map-capture/node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/prepare-map-thumbnail.mjs
      - run: python scripts/finalize-map-thumbnail.py
      - name: Commit the reviewed assets to the preparation branch
        run: |
          git config user.name 'White Glove content preparation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/photos/discovery data/discovery-photos.generated.ts data/expanded-attractions.ts public/photos/homepage/map.webp data/homepage-photo-sources.json public/photos/homepage/LICENSES.json
          git commit -m 'Finalize reviewed photographs and replace compass with basic map'
          git push origin HEAD:codex/destination-photo-research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-discovery-photo-review
          path: destination-research
          retention-days: 7
