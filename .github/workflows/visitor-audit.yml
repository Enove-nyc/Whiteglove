name: Visitor launch audit
on:
  push:
    branches: [codex/visitor-launch-audit]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visitor-audit
  cancel-in-progress: true
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        brand: [travel, itineraries]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUDIT_BRAND: ${{ matrix.brand }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - name: Browse actual production site without writes
        run: node scripts/visitor-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-${{ matrix.brand }}
          path: audit-results/
          retention-days: 7
