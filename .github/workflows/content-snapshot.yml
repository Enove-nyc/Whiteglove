# Write the database into the repository, nightly.
#
# WHAT THIS IS FOR. The site's content lives in two places: the data/*.ts files,
# which are in git, and the Postgres database, which is where everything the
# owner adds through the admin goes. The public pages merge the two, so the site
# is right. A checkout is not — it shows the built-in half only. The owner put
# it plainly: "I entered a number and you don't see it."
#
# So this reads the database and commits what it finds, once a day. After it has
# run, a checkout holds the same content the live site does, a changed shomer
# number is a diff somebody can read, and there is an offline copy of the corpus
# that does not depend on the database being up.
#
# PUBLISHED CONTENT ONLY. This repository is public, and lib/content-snapshot.ts
# selects for that: drafts are dropped, and everything written here is already
# on a page any visitor can load. The private backup — which does hold drafts —
# is the admin export, and it is a different file that is not committed anywhere.
#
# WHAT IT NEEDS: a DATABASE_URL repository secret. A read-only role is enough
# and is the right one to use; nothing here writes to the database.

name: Content snapshot

on:
  schedule:
    # 04:10 UTC. Late enough that a night's editing is in, early enough that the
    # diff is waiting before the day starts. Not on the hour: GitHub queues
    # everybody who asks for :00 and the run drifts.
    - cron: "10 4 * * *"
  # So it can be taken on demand — after a big import, or before asking somebody
  # to work from the repository.
  workflow_dispatch:

concurrency:
  group: content-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The postinstall runs `prisma generate`, which is what the script needs.
      - run: npm ci

      - name: Read the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/write-snapshot.ts

      # Nothing to say when nothing changed: the script leaves the file alone,
      # so there is no commit and no noise on a quiet day.
      - name: Commit it if it moved
        run: |
          if [ -z "$(git status --porcelain data/snapshot)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          git commit -m "Content snapshot: what the database says today"
          git push
