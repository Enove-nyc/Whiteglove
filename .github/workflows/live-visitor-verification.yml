name: Live visitor verification
on:
  push:
    branches: [codex/live-site-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        brand: [travel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only the browser verification dependencies
        run: |
          mkdir -p /tmp/wg-live-checks
          cp scripts/visitor-journeys.mjs /tmp/wg-live-checks/visitor-journeys.mjs
          npm install --prefix /tmp/wg-live-checks --ignore-scripts --no-audit --no-fund playwright@1.62.0 @axe-core/playwright
          /tmp/wg-live-checks/node_modules/.bin/playwright install --with-deps chromium
      - run: node /tmp/wg-live-checks/visitor-journeys.mjs
        env:
          AUDIT_BRAND: ${{ matrix.brand }}
          AUDIT_FAIL_ON_FINDINGS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-verification-${{ matrix.brand }}
          path: journey-results/
          retention-days: 7

