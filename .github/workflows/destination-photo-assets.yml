name: Prepare reviewed destination photo assets
on:
  push:
    branches: [codex/destination-photo-research]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    if: contains(github.event.head_commit.message, '[prepare assets]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/prepare-discovery-photo-assets.py
      - name: Commit reviewable assets to the preparation branch
        run: |
          git config user.name 'White Glove content preparation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/photos/discovery data/discovery-photos.generated.ts data/expanded-attractions.ts
          git commit -m 'Prepare licensed static place photographs and checked attraction candidates'
          git push origin HEAD:codex/destination-photo-research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-destination-photo-review
          path: destination-research
          retention-days: 7
