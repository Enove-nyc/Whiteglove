name: Prepare homepage search background photographs
on:
  push:
    branches: [codex/destination-photo-research]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[hero assets]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python scripts/prepare-home-search-photos.py
      - name: Commit reviewed responsive photo variants
        run: |
          git config user.name 'White Glove content preparation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/photos/discovery data/homepage-search-photos.ts
          git commit -m 'Prepare responsive real photographs for the search background'
          git push origin HEAD:codex/destination-photo-research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-search-photo-review
          path: destination-research
          retention-days: 7
