name: Food photo candidates
on:
  push:
    branches: [codex/travel-colour-refresh]
    paths: ['scripts/prepare-food-photos.py', '.github/workflows/food-photo-candidates.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow
      - run: python scripts/prepare-food-photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: food-photo-candidates
          path: photo-results/
          retention-days: 7
